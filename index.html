<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestión de Obras</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-surface text-on-surface antialiased h-screen flex flex-col overflow-hidden">

    <!-- BLOQUE 1: HEADER -->
    <header id="app-header" class="hidden w-full bg-surface-container shadow-sm px-4 py-3 justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">engineering</span>
            <h1 class="text-xl font-medium tracking-tight">Diario de Obra</h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="user-role-badge" class="text-xs bg-primary-container text-on-primary-container px-2 py-1 rounded-full font-medium"></span>
            <button id="btn-logout" class="material-symbols-outlined text-on-surface-variant p-2 hover:bg-surface-variant rounded-full">logout</button>
        </div>
    </header>

    <!-- BLOQUE 2: AUTENTICACIÓN (Login y Registro) -->
    <main id="view-auth" class="flex-1 flex flex-col items-center justify-center p-6 w-full max-w-md mx-auto">
        <div class="bg-surface-container-low p-8 rounded-3xl shadow-md w-full flex flex-col gap-6">
            <div class="text-center">
                <span class="material-symbols-outlined text-5xl text-primary mb-2">lock</span>
                <h2 id="auth-title" class="text-2xl font-medium">Iniciar Sesión</h2>
                <p id="auth-subtitle" class="text-sm text-on-surface-variant mt-1">Acceso para operarios</p>
            </div>
            
            <form id="form-auth" class="flex flex-col gap-4">
                <!-- Campos extra para Registro (Ocultos en Login) -->
                <div id="register-fields" class="hidden flex-col gap-4">
                    <div class="md3-input-group">
                        <label>Nombre</label>
                        <input type="text" id="auth-nombre">
                    </div>
                    <div class="md3-input-group">
                        <label>Apellido</label>
                        <input type="text" id="auth-apellido">
                    </div>
                </div>

                <div class="md3-input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="auth-email" required>
                </div>
                <div class="md3-input-group">
                    <label>Contraseña</label>
                    <input type="password" id="auth-password" required minlength="6">
                </div>
                
                <button type="submit" id="btn-auth-submit" class="bg-primary text-on-primary w-full py-3 rounded-full font-medium mt-2 shadow-sm hover:shadow-md transition-all">Ingresar</button>
                <p id="auth-error" class="text-error text-sm text-center hidden"></p>
                <p id="auth-success" class="text-green-600 text-sm text-center hidden"></p>
            </form>
            
            <div class="text-center mt-2">
                <button id="btn-toggle-auth" class="text-primary text-sm font-medium hover:underline">¿No tienes cuenta? Regístrate aquí</button>
            </div>
        </div>
    </main>

    <!-- BLOQUE 3: CONTENIDO PRINCIPAL DE LA APP -->
    <main id="main-content" class="hidden flex-1 overflow-y-auto p-4 w-full max-w-4xl mx-auto pb-24 relative">
        
        <!-- Vista: Lista de Tareas -->
        <section id="view-task-list" class="flex flex-col gap-4">
            <div class="bg-surface-container-high rounded-full flex items-center px-4 py-2 shadow-sm">
                <span class="material-symbols-outlined text-on-surface-variant mr-2">search</span>
                <input type="text" id="search-tareas" placeholder="Buscar por operario o tarea..." class="bg-transparent border-none outline-none w-full text-on-surface placeholder:text-on-surface-variant">
            </div>
            <h2 class="text-lg font-medium text-on-surface mt-2">Diario de Tareas</h2>
            <div id="tasks-container" class="flex flex-col gap-3"></div>
        </section>

        <!-- Vista: Nueva Tarea -->
        <section id="view-new-task" class="hidden flex-col gap-4">
            <h2 class="text-lg font-medium text-on-surface">Asignar Nueva Tarea</h2>
            <form id="form-new-task" class="flex flex-col gap-4 bg-surface-container-low p-4 rounded-2xl shadow-sm">
                <div class="md3-input-group"><label>Cliente</label><input type="text" id="input-cliente" required></div>
                <div class="md3-input-group"><label>Obra</label><input type="text" id="input-obra" required></div>
                <div class="flex gap-4">
                    <div class="md3-input-group flex-1"><label>Dirección</label><input type="text" id="input-direccion" required></div>
                    <div class="md3-input-group flex-1"><label>Localidad</label><input type="text" id="input-localidad" required></div>
                </div>
                
                <!-- AQUÍ EL CAMBIO: Selector de operario en lugar de texto -->
                <div class="md3-input-group">
                    <label>Operario (Asignado a)</label>
                    <select id="select-operario" required class="bg-surface border border-outline-variant rounded p-3 text-on-surface focus:outline-none focus:border-primary focus:border-2">
                        <option value="">Cargando operarios...</option>
                    </select>
                </div>

                <div class="md3-input-group"><label>Tarea a realizar</label><textarea id="input-tarea" rows="3" required></textarea></div>
                
                <div id="attached-drawing-container" class="hidden flex flex-col gap-2">
                    <img id="preview-drawing" src="" class="rounded-xl border border-outline max-w-xs">
                    <button type="button" id="btn-remove-drawing" class="text-error text-sm font-medium self-start">Eliminar dibujo</button>
                </div>
                <div class="flex justify-between items-center mt-4">
                    <button type="button" id="btn-open-canvas" class="flex items-center gap-2 text-primary font-medium p-2 rounded-xl hover:bg-primary-container transition-colors"><span class="material-symbols-outlined">draw</span>Añadir Pizarra</button>
                    <button type="submit" class="bg-primary text-on-primary px-6 py-2 rounded-full font-medium shadow-md">Guardar Tarea</button>
                </div>
            </form>
        </section>

        <!-- Vista: Gestión de Empleados (Solo Admins) -->
        <section id="view-empleados" class="hidden flex-col gap-4">
            <h2 class="text-lg font-medium text-on-surface">Gestión de Personal</h2>
            <div id="empleados-container" class="flex flex-col gap-3"></div>
        </section>

    </main>

    <!-- BLOQUE 4: MODAL DE PIZARRA (Oculto) -->
    <!-- (Mantén tu bloque actual de <div id="modal-canvas">...</div> exactamente igual aquí) -->

    <!-- BLOQUE 5: FAB Y NAVEGACIÓN INFERIOR -->
    <button id="fab-new-task" class="hidden fixed bottom-20 right-4 sm:right-8 bg-primary-container text-on-primary-container p-4 rounded-2xl shadow-lg z-40 items-center justify-center"><span class="material-symbols-outlined">add</span></button>

    <nav id="bottom-nav" class="hidden w-full bg-surface-container border-t border-outline-variant px-6 py-2 flex justify-around items-center shrink-0 z-40 pb-safe">
        <button id="nav-home" class="nav-btn flex flex-col items-center text-primary active">
            <span class="material-symbols-outlined bg-secondary-container px-4 py-1 rounded-full mb-1">list_alt</span>
            <span class="text-[11px] font-medium">Diario</span>
        </button>
        <!-- Botón Empleados (Solo se mostrará a Admins por JS) -->
        <button id="nav-empleados" class="nav-btn hidden flex-col items-center text-on-surface-variant hover:text-primary transition-colors">
            <span class="material-symbols-outlined px-4 py-1 rounded-full mb-1">group</span>
            <span class="text-[11px] font-medium">Empleados</span>
        </button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
