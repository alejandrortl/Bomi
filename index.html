<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestión de Obras</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-surface text-on-surface antialiased h-screen flex flex-col overflow-hidden">

    <!-- BLOQUE 1: HEADER -->
    <header id="app-header" class="hidden w-full bg-surface-container shadow-sm px-4 py-3 justify-between items-center z-30 shrink-0 relative">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">engineering</span>
            <h1 class="text-xl font-medium tracking-tight">Diario de Obra</h1>
        </div>
        <div class="flex items-center gap-3">
            <select id="select-tema" class="text-xs bg-surface border border-outline-variant rounded-full px-3 py-1.5 text-on-surface focus:outline-none focus:border-primary">
                <option value="auto">🌓 Auto</option>
                <option value="claro">☀️ Claro</option>
                <option value="oscuro">🌙 Oscuro</option>
            </select>
            
            <span id="user-role-badge" class="text-xs bg-primary-container text-on-primary-container px-2 py-1 rounded-full font-medium hidden sm:inline-block"></span>
            
            <!-- MENÚ DESPLEGABLE DE PERFIL CON FONDO SÓLIDO Y SOMBRA -->
            <div class="relative">
                <button id="btn-menu-perfil" class="flex items-center gap-1 bg-surface-variant text-on-surface px-3 py-1.5 rounded-full text-xs font-medium hover:bg-surface-variant/80 transition-colors">
                    <span class="material-symbols-outlined text-[18px]">account_circle</span>
                    <span id="header-username-label" class="hidden sm:inline">Cuenta</span>
                    <span class="material-symbols-outlined text-[16px]">arrow_drop_down</span>
                </button>

                <div id="dropdown-menu-perfil" class="hidden absolute right-0 mt-2 w-48 bg-surface-container-high text-on-surface border border-outline-variant rounded-2xl shadow-2xl py-2 z-50 flex flex-col">
                    <button id="menu-item-perfil" class="w-full text-left px-4 py-2.5 text-sm text-on-surface hover:bg-surface-variant flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">person</span> Mi Perfil
                    </button>
                    <button id="menu-item-empresa" class="hidden w-full text-left px-4 py-2.5 text-sm text-on-surface hover:bg-surface-variant items-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">business</span> Datos de Empresa
                    </button>
                    <div class="border-t border-outline-variant my-1"></div>
                    <button id="btn-logout" class="w-full text-left px-4 py-2.5 text-sm text-error hover:bg-red-50 dark:hover:bg-red-950/30 flex items-center
