<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestión de Obras</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-surface text-on-surface antialiased h-screen flex flex-col overflow-hidden">

    <!-- BLOQUE 1: HEADER -->
    <header id="app-header" class="hidden w-full bg-surface-container shadow-sm px-4 py-3 justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">engineering</span>
            <h1 class="text-xl font-medium tracking-tight">Diario de Obra</h1>
        </div>
        <button id="btn-logout" class="material-symbols-outlined text-on-surface-variant p-2 hover:bg-surface-variant rounded-full">logout</button>
    </header>

    <!-- BLOQUE 2: LOGIN (Visible por defecto hasta comprobar sesión) -->
    <main id="view-login" class="flex-1 flex flex-col items-center justify-center p-6 w-full max-w-md mx-auto">
        <div class="bg-surface-container-low p-8 rounded-3xl shadow-md w-full flex flex-col gap-6">
            <div class="text-center">
                <span class="material-symbols-outlined text-5xl text-primary mb-2">lock</span>
                <h2 class="text-2xl font-medium">Iniciar Sesión</h2>
                <p class="text-sm text-on-surface-variant mt-1">Acceso para operarios</p>
            </div>
            <form id="form-login" class="flex flex-col gap-4">
                <div class="md3-input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="login-email" required autocomplete="email">
                </div>
                <div class="md3-input-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" required autocomplete="current-password">
                </div>
                <button type="submit" class="bg-primary text-on-primary w-full py-3 rounded-full font-medium mt-2 shadow-sm hover:shadow-md transition-all">Ingresar</button>
                <p id="login-error" class="text-error text-sm text-center hidden"></p>
            </form>
        </div>
    </main>

    <!-- BLOQUE 3: CONTENIDO PRINCIPAL (Oculto hasta iniciar sesión) -->
    <main id="main-content" class="hidden flex-1 overflow-y-auto p-4 w-full max-w-4xl mx-auto pb-24 relative">
        
        <!-- Vista: Lista de Tareas -->
        <section id="view-task-list" class="flex flex-col gap-4">
            <!-- Barra de búsqueda MD3 -->
            <div class="bg-surface-container-high rounded-full flex items-center px-4 py-2 shadow-sm">
                <span class="material-symbols-outlined text-on-surface-variant mr-2">search</span>
                <input type="text" id="search-operario" placeholder="Buscar por operario o tarea..." class="bg-transparent border-none outline-none w-full text-on-surface placeholder:text-on-surface-variant">
            </div>

            <div class="flex justify-between items-center mt-2">
                <h2 id="titulo-tareas" class="text-lg font-medium text-on-surface">Mis Tareas de Hoy</h2>
            </div>
            
            <div id="tasks-container" class="flex flex-col gap-3">
                <!-- Tarjetas de tareas se inyectan por JS -->
            </div>
        </section>

        <!-- Vista: Nueva Tarea (Mismo formulario del paso anterior, resumido visualmente) -->
        <section id="view-new-task" class="hidden flex-col gap-4">
            <!-- ... (Aquí va el formulario y modal de pizarra de la respuesta anterior, lo omito para mantener concisión, pero debes dejarlo en tu archivo real) ... -->
        </section>
    </main>

    <!-- BLOQUE 4: FAB Y NAVEGACIÓN -->
    <button id="fab-new-task" class="hidden fixed bottom-20 right-4 sm:right-8 bg-primary-container text-on-primary-container p-4 rounded-2xl shadow-lg z-40 items-center justify-center">
        <span class="material-symbols-outlined">add</span>
    </button>

    <nav id="bottom-nav" class="hidden w-full bg-surface-container border-t border-outline-variant px-6 py-2 flex justify-around items-center shrink-0 z-40 pb-safe">
        <button id="nav-home" class="flex flex-col items-center text-primary">
            <span class="material-symbols-outlined bg-secondary-container px-4 py-1 rounded-full mb-1">list_alt</span>
            <span class="text-[11px] font-medium">Diario</span>
        </button>
    </nav>

    <!-- Scripts Base -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
