<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diario de Obra</title>
    
    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));
    </style>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'auto';
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'oscuro' || (savedTheme === 'auto' && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="/api/manifest">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="/api/icono?size=180">
    <link rel="icon" type="image/png" href="/api/icono?size=192">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Diario de Obra">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-black text-slate-900 dark:text-slate-100 antialiased h-screen h-[100dvh] flex flex-col overflow-hidden">

    <!-- BLOQUE 1: HEADER -->
    <header id="app-header" class="hidden w-full bg-white dark:bg-zinc-900 border-b border-slate-200 dark:border-zinc-800 px-3 sm:px-4 py-3 justify-between items-center gap-2 z-30 shrink-0 relative shadow-sm">
        <div class="flex items-center gap-2 min-w-0">
            <span class="material-symbols-outlined text-blue-600 dark:text-blue-400 shrink-0">engineering</span>
            <h1 id="header-app-title" class="hidden min-[480px]:block text-xl font-semibold tracking-tight truncate max-w-[150px] sm:max-w-xs">Diario de Obra</h1>
        </div>
        <div class="flex items-center gap-1 sm:gap-3 min-w-0">
            <button id="btn-mensajes" aria-label="Mensajes" class="relative text-slate-600 dark:text-slate-300 p-1.5 rounded-full hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">
                <span class="material-symbols-outlined text-[22px]">chat</span>
                <span id="badge-mensajes" class="hidden absolute top-1 right-1 w-2 h-2 bg-red-600 rounded-full"></span>
            </button>
            <button id="btn-notificaciones" aria-label="Notificaciones" class="relative text-slate-600 dark:text-slate-300 p-1.5 rounded-full hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">
                <span class="material-symbols-outlined text-[22px]">notifications</span>
                <span id="badge-notificaciones" class="hidden absolute top-1 right-1 w-2 h-2 bg-red-600 rounded-full"></span>
            </button>
            <select id="select-tema" aria-label="Seleccionar tema" title="Tema" class="text-xs bg-slate-100 dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 rounded-full px-2 sm:px-3 py-1.5 focus:outline-none cursor-pointer">
                <option value="auto" data-corto="🌓" data-largo="🌓 Auto">🌓</option>
                <option value="claro" data-corto="☀️" data-largo="☀️ Claro">☀️</option>
                <option value="oscuro" data-corto="🌙" data-largo="🌙 Oscuro">🌙</option>
            </select>
            <span id="user-role-badge" class="text-xs bg-blue-100 dark:bg-blue-950 text-blue-800 dark:text-blue-200 px-2.5 py-1 rounded-full font-medium hidden sm:inline-block"></span>
            <div class="relative min-w-0">
                <button id="btn-menu-perfil" aria-haspopup="true" aria-expanded="false" aria-controls="dropdown-menu-perfil" class="flex items-center gap-1 bg-slate-100 dark:bg-zinc-800 px-2 sm:px-3 py-1.5 rounded-full text-xs font-medium hover:bg-slate-200 dark:hover:bg-zinc-700 transition-colors">
                    <span class="material-symbols-outlined text-[18px]">account_circle</span>
                    <span id="header-username-label" class="truncate max-w-[4.5rem] min-[400px]:max-w-[5.5rem] sm:max-w-none">Cargando...</span>
                    <span class="material-symbols-outlined text-[16px]">arrow_drop_down</span>
                </button>
                <div id="dropdown-menu-perfil" class="hidden absolute right-0 mt-2 w-56 max-w-[calc(100vw-1rem)] bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl shadow-xl py-2 z-50 flex-col">
                    <button id="menu-item-perfil" class="w-full text-left px-4 py-2.5 text-sm hover:bg-slate-100 dark:hover:bg-zinc-800 flex items-center gap-2"><span class="material-symbols-outlined text-[18px]">person</span> Mi Perfil</button>
                    <button id="menu-item-empresa" class="hidden w-full text-left px-4 py-2.5 text-sm hover:bg-slate-100 dark:hover:bg-zinc-800 items-center gap-2"><span class="material-symbols-outlined text-[18px]">business</span> Logotipo y empresa</button>
                    <div class="border-t border-slate-200 dark:border-zinc-800 my-1"></div>
                    <button id="btn-logout" class="w-full text-left px-4 py-2.5 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 flex items-center gap-2"><span class="material-symbols-outlined text-[18px]">logout</span> Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </header>

    <!-- BLOQUE 2: AUTENTICACIÓN -->
    <main id="view-auth" class="flex-1 flex flex-col items-center justify-center p-6 w-full max-w-md mx-auto overflow-y-auto">
        <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-8 rounded-3xl shadow-lg w-full flex flex-col gap-6">
            <div class="text-center">
                <span class="material-symbols-outlined text-5xl text-blue-600 dark:text-blue-400 mb-2">lock</span>
                <h2 id="auth-title" class="text-2xl font-semibold">Iniciar Sesión</h2>
                <p id="auth-subtitle" class="text-sm text-slate-500 dark:text-slate-400 mt-1">Acceso privado para el equipo</p>
            </div>
            <form id="form-auth" class="flex flex-col gap-4">
                <div id="register-fields" class="hidden flex-col gap-4">
                    <div class="flex flex-col gap-1"><label for="auth-nombre" class="text-xs font-medium">Nombre</label><input type="text" id="auth-nombre" class="bg-slate-50 dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 rounded-xl p-3 text-sm"></div>
                    <div class="flex flex-col gap-1"><label for="auth-apellido" class="text-xs font-medium">Apellido</label><input type="text" id="auth-apellido" class="bg-slate-50 dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 rounded-xl p-3 text-sm"></div>
                </div>
                <div class="flex flex-col gap-1"><label for="auth-email" class="text-xs font-medium">Correo Electrónico</label><input type="email" id="auth-email" required class="bg-slate-50 dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 rounded-xl p-3 text-sm"></div>
                <div class="flex flex-col gap-1"><label for="auth-password" class="text-xs font-medium">Contraseña</label><input type="password" id="auth-password" required minlength="6" class="bg-slate-50 dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 rounded-xl p-3 text-sm"></div>
                <button type="submit" id="btn-auth-submit" class="bg-blue-600 hover:bg-blue-700 text-white w-full py-3 rounded-full font-medium mt-2 shadow-md transition-colors">Ingresar</button>
                <p id="auth-error" class="text-red-600 text-sm text-center hidden"></p>
                <p id="auth-success" class="text-emerald-600 text-sm text-center hidden"></p>
            </form>
            <div class="text-center mt-2 flex flex-col gap-3">
                <button type="button" id="btn-olvide" class="text-slate-500 dark:text-slate-400 text-sm hover:underline">¿Has olvidado tu contraseña?</button>
                <button id="btn-toggle-auth" class="text-blue-600 text-sm font-medium hover:underline">¿No tienes cuenta? Regístrate aquí</button>
                <button type="button" id="btn-back-login" class="hidden w-full py-3 rounded-full font-medium text-sm border border-slate-300 hover:bg-slate-100 flex items-center justify-center gap-2"><span class="material-symbols-outlined text-[18px]">arrow_back</span> Volver</button>
            </div>
        </div>
    </main>

    <!-- BLOQUE 3: CONTENIDO PRINCIPAL -->
    <main id="main-content" class="hidden flex-1 overflow-y-auto p-4 w-full max-w-4xl mx-auto pb-40 relative">
        
        <!-- Vista: Diario de Tareas -->
        <section id="view-task-list" class="flex flex-col gap-4 relative min-h-full">
            <div class="flex flex-col gap-3 sticky top-0 bg-slate-50 dark:bg-black z-10 pt-2 pb-3">
                <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-full flex items-center px-4 py-2 shadow-sm">
                    <span class="material-symbols-outlined text-slate-400 mr-2">search</span>
                    <input type="text" id="search-tareas" aria-label="Buscar tareas" placeholder="Buscar cliente, obra, dirección, fecha, operario, notas..." class="bg-transparent border-none outline-none w-full text-sm placeholder:text-slate-400">
                </div>
                <div class="flex gap-1 bg-slate-100 dark:bg-zinc-800 rounded-full p-1" role="group" aria-label="Qué tareas ver">
                    <button type="button" data-filtro-diario="todas" class="flex-1 py-2 rounded-full text-sm font-medium">Todas las tareas</button>
                    <button type="button" data-filtro-diario="mias" class="flex-1 py-2 rounded-full text-sm font-medium">Mis tareas</button>
                </div>
                <div class="flex justify-between items-center bg-white dark:bg-zinc-900 p-3 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-sm">
                    <h2 class="text-sm font-semibold flex items-center gap-2"><span class="material-symbols-outlined text-blue-600">calendar_month</span> Agenda del Día:</h2>
                    <input type="date" id="filtro-fecha-diario" aria-label="Filtrar por fecha" class="bg-slate-100 dark:bg-zinc-800 border-none rounded-lg p-2 text-sm font-medium focus:ring-2 focus:ring-blue-600 cursor-pointer">
                </div>
            </div>
            <div id="tasks-container" class="flex flex-col gap-3 pb-6"></div>
            <button id="fab-new-task" aria-label="Crear nueva tarea" class="fixed bottom-20 right-4 sm:right-8 bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl shadow-2xl z-30 flex items-center justify-center transition-transform active:scale-95">
                <span class="material-symbols-outlined">add</span>
            </button>
        </section>

        <!-- Vista: Formulario Tarea -->
        <section id="view-form-tarea" class="hidden flex-col gap-4">
            <h2 class="text-lg font-semibold" id="form-tarea-title">Nueva Tarea</h2>
            <form id="form-tarea" class="flex flex-col gap-4 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-6 rounded-3xl shadow-sm">
                <input type="hidden" id="edit-tarea-id" value="">
                <div class="flex gap-4 flex-col sm:flex-row">
                    <div class="flex flex-col gap-1 flex-1"><label for="tarea-cliente" class="text-xs font-medium">Cliente</label><input type="text" id="tarea-cliente" list="clientes-datalist" autocomplete="off" required class="bg-slate-50 dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 rounded-xl p-3 text-sm"></div>
                    <div class="flex flex-col gap-1 flex-1"><label for="tarea-obra" class="text-xs font-medium">Obra</label><input type="text" id="tarea-obra" list="tarea-obras-dl" autocomplete="off" required class="bg-slate-50 dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 rounded-xl p-3 text-sm"></div>
                </div>
                <div class="flex gap-4 flex-col sm:flex-row">
                    <div class="flex flex-col gap-1 flex-1"><label for="tarea-direccion" class="text-xs font-medium">Dirección</label><input type="text" id="tarea-direccion" required class="read-only:opacity-70 bg-slate-50 dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 rounded-xl p-3 text-sm"></div>
                    <div class="flex flex-col gap-1 flex-1"><label for="tarea-localidad" class="text-xs font-medium">Localidad</label><input type="text" id="tarea-localidad" required class="read-only:opacity-70 bg-slate-50 dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 rounded-xl p-3 text-sm"></div>
                </div>
                <p id="tarea-hint" class="hidden text-xs text-slate-500 bg-slate-100 dark:bg-zinc-800 rounded-xl p-3"></p>
                <div class="flex gap-4 flex-col sm:flex-row">
                    <div class="flex flex-col gap-1 flex-1"><label for="tarea-operario" class="text-xs font-medium">Operario Asignado</label><select id="tarea-operario" required class="bg-slate-50 dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 rounded-xl p-3 text-sm"><option value="">Selecciona un empleado</option></select></div>
                    <div class="flex flex-col gap-1 flex-1"><label for="tarea-fecha" class="text-xs font-medium">Fecha</label><input type="date" id="tarea-fecha" required class="bg-slate-50 dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 rounded-xl p-3 text-sm"></div>
                </div>
                <div class="flex flex-col gap-1 border-t border-slate-200 dark:border-zinc-800 pt-4">
                    <div class="flex justify-between items-center mb-1">
                        <label for="tarea-notas" class="text-xs font-medium">Notas / Descripción</label>
                        <button type="button" id="btn-dictar-voz" class="text-xs bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-200 px-3 py-1.5 rounded-full flex items-center gap-1 font-medium hover:bg-blue-200 transition-colors">
                            <span class="material-symbols-outlined text-[16px]">mic</span> Dictar
                        </button>
                    </div>
                    <textarea id="tarea-notas" rows="4" class="w-full bg-slate-50 dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 rounded-xl p-3 text-sm" placeholder="Detalles..."></textarea>
                </div>
                <div class="flex flex-col gap-2 border-t border-slate-200 dark:border-zinc-800 pt-4">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-medium">Dibujo / Pizarra (Opcional)</label>
                        <button type="button" id="btn-abrir-pizarra" class="text-xs bg-slate-200 dark:bg-zinc-700 px-3 py-1.5 rounded-lg font-medium flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">draw</span> Abrir Pizarra</button>
                    </div>
                    <input type="hidden" id="tarea-dibujo-url">
                    <div id="preview-dibujo" style="display:none" class="mt-2 border border-slate-300 rounded-xl p-2 bg-slate-50 dark:bg-zinc-800 relative inline-block max-w-[200px]">
                        <img src="" id="img-dibujo-preview" class="w-full h-auto rounded-lg">
                        <button type="button" id="btn-borrar-dibujo" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full p-1"><span class="material-symbols-outlined text-[14px]">close</span></button>
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-slate-200 dark:border-zinc-800">
                    <button type="button" id="btn-cancel-tarea" class="px-4 py-2 rounded-full font-medium text-slate-600">Cancelar</button>
                    <button type="submit" id="btn-submit-tarea" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full font-medium shadow-md">Guardar Tarea</button>
                </div>
            </form>
        </section>

        <!-- Vista: Detalle Tarea -->
        <section id="view-detalle-tarea" class="hidden flex-col gap-4 max-w-2xl mx-auto w-full">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold">Detalle de Tarea</h2>
                <div class="flex gap-2">
                    <button type="button" id="btn-export-pdf-tarea" class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-full font-medium flex items-center gap-1 shadow-sm"><span class="material-symbols-outlined text-[16px]">picture_as_pdf</span> Exportar</button>
                    <button type="button" id="btn-back-tarea-list" class="text-xs bg-slate-200 dark:bg-zinc-800 px-3 py-1.5 rounded-full font-medium">Volver</button>
                </div>
            </div>
            <div id="pdf-export-container-tarea" class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-6 rounded-3xl shadow-sm flex flex-col gap-4 relative">
                <div id="sello-completada" class="hidden absolute top-6 right-6 border-4 border-emerald-600 text-emerald-600 font-bold text-xl px-4 py-1 rounded-xl rotate-12 opacity-80">COMPLETADA</div>
                <div class="border-b border-slate-200 dark:border-zinc-800 pb-4 mb-2"><h3 class="font-bold text-base text-blue-600 dark:text-blue-400">Orden de Trabajo / Tarea</h3></div>
                <div id="detalle-tarea-content" class="flex flex-col gap-4"></div>
            </div>
        </section>

        <!-- VISTA: EMPLEADOS (la construye js/modules/empleados.js) -->
        <section id="view-empleados" class="hidden flex-col gap-4"></section>

        <!-- RESTO DE VISTAS (Partes, Bitácora, Materiales, Clientes, Perfil, Empresa) -->
        <section id="view-partes" class="hidden flex-col gap-4"></section>
        <section id="view-form-parte" class="hidden flex-col gap-4"></section>
        <section id="view-detalle-parte" class="hidden flex-col gap-4 max-w-2xl mx-auto w-full"></section>
        <section id="view-bitacora" class="hidden flex-col gap-4"></section>
        <section id="view-materiales" class="hidden flex-col gap-4"></section>
        <section id="view-mensajes" class="hidden flex-col gap-4"></section>
        <section id="view-clientes" class="hidden flex-col gap-4"></section>
        <section id="view-perfil" class="hidden flex-col gap-4 max-w-lg mx-auto w-full"></section>
        <section id="view-empresa" class="hidden flex-col gap-4 max-w-lg mx-auto w-full"></section>
    </main>

    <!-- DATALISTS -->
    <datalist id="clientes-datalist"></datalist>
    <datalist id="tarea-obras-dl"></datalist>

    <!-- BLOQUE 5: NAVEGACIÓN INFERIOR -->
    <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 w-full bg-white dark:bg-zinc-900 border-t border-slate-200 dark:border-zinc-800 px-4 py-2 flex justify-around items-center z-40 pb-safe shadow-lg">
        <button id="nav-home" class="nav-btn flex flex-col items-center text-slate-500 hover:text-blue-600 transition-colors"><span class="material-symbols-outlined px-4 py-1 rounded-full mb-1">list_alt</span><span class="text-[11px] font-medium">Diario</span></button>
        <button id="nav-partes" class="nav-btn flex flex-col items-center text-slate-500 hover:text-blue-600 transition-colors"><span class="material-symbols-outlined px-4 py-1 rounded-full mb-1">assignment</span><span class="text-[11px] font-medium">Partes</span></button>
        <button id="nav-bitacora" class="nav-btn flex flex-col items-center text-slate-500 hover:text-blue-600 transition-colors"><span class="material-symbols-outlined px-4 py-1 rounded-full mb-1">menu_book</span><span class="text-[11px] font-medium">Bitácora</span></button>
        <button id="nav-materiales" class="nav-btn flex flex-col items-center text-slate-500 hover:text-blue-600 transition-colors"><span class="material-symbols-outlined px-4 py-1 rounded-full mb-1">inventory_2</span><span class="text-[11px] font-medium">Materiales</span></button>
        <button id="nav-clientes" class="nav-btn flex flex-col items-center text-slate-500 hover:text-blue-600 transition-colors"><span class="material-symbols-outlined px-4 py-1 rounded-full mb-1">business_center</span><span class="text-[11px] font-medium">Clientes</span></button>
        <button id="nav-empleados" class="nav-btn hidden flex-col items-center text-slate-500 hover:text-blue-600 transition-colors"><span class="material-symbols-outlined px-4 py-1 rounded-full mb-1">group</span><span class="text-[11px] font-medium">Empleados</span></button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/modules/recuperar.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/modules/clientes.js"></script>
    <script src="js/modules/empleados.js"></script>
    <script src="js/modules/pdf.js"></script>
    <script src="js/modules/cuenta.js"></script>
    <script src="js/modules/notificaciones.js"></script>
    <script src="js/modules/pizarra.js"></script>
    <script src="js/modules/bitacora.js"></script>
    <script src="js/modules/materiales.js"></script>
    <script src="js/modules/partes.js"></script>
    <script src="js/modules/mensajes.js"></script>
    <script src="js/modules/push.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
