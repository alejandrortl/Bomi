<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App del Equipo</title>
    
    <!-- Material Symbols (Iconos) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <!-- Tailwind CSS (Estructura visual rápida basada en MD3) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CSS y JS Propios (Todo el estilo y lógica va fuera) -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 text-gray-900 antialiased h-screen flex flex-col">

    <!-- BLOQUE 1: HEADER / BARRA SUPERIOR -->
    <header class="w-full bg-white shadow-sm px-4 py-3 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-blue-600">group</span>
            <h1 class="text-xl font-medium tracking-tight">Mi Equipo</h1>
        </div>
        <div id="user-menu" class="flex gap-4">
            <!-- Botón de logout (la lógica irá en app.js) -->
            <button id="btn-logout" class="hidden text-sm font-medium text-gray-600 hover:text-gray-900">Salir</button>
        </div>
    </header>

    <!-- BLOQUE 2: ÁREA DE NOTIFICACIONES (Alertas MD3) -->
    <div id="alert-container" class="fixed top-16 left-1/2 transform -translate-x-1/2 w-11/12 max-w-md z-50 flex flex-col gap-2 empty:hidden"></div>

    <!-- BLOQUE 3: CONTENIDO PRINCIPAL DINÁMICO -->
    <main id="main-content" class="flex-1 overflow-y-auto p-4 w-full max-w-4xl mx-auto pb-20">
        
        <!-- Pantalla de Carga (Spinner) -->
        <div id="loading-state" class="flex flex-col h-full items-center justify-center text-gray-400">
            <span class="material-symbols-outlined animate-spin text-4xl mb-2">sync</span>
            <p>Cargando datos...</p>
        </div>

        <!-- Vista de Login (Oculta por defecto) -->
        <section id="view-login" class="hidden flex-col items-center justify-center mt-10">
            <!-- Formulario inyectado por JS -->
        </section>

        <!-- Vista de Datos de la App (Oculta por defecto) -->
        <section id="view-app" class="hidden flex-col gap-4">
            <!-- Los datos de Supabase se pintarán aquí -->
        </section>

    </main>

    <!-- BLOQUE 4: NAVEGACIÓN INFERIOR (Mobile - Material Design 3) -->
    <nav class="w-full bg-white border-t border-gray-200 px-6 py-2 flex justify-between items-center shrink-0 sm:hidden">
        <button class="flex flex-col items-center text-blue-600">
            <span class="material-symbols-outlined">home</span>
            <span class="text-xs font-medium">Inicio</span>
        </button>
        <button class="flex flex-col items-center text-gray-500 hover:text-blue-600">
            <span class="material-symbols-outlined">add_circle</span>
            <span class="text-xs font-medium">Nuevo</span>
        </button>
        <button class="flex flex-col items-center text-gray-500 hover:text-blue-600">
            <span class="material-symbols-outlined">person</span>
            <span class="text-xs font-medium">Perfil</span>
        </button>
    </nav>

    <!-- Base de Datos y Lógica (Cargados al final para mejor rendimiento) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
