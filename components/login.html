<div class="flex flex-col items-center justify-center min-h-[80vh] px-4">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-lg w-full max-w-md border border-gray-100 dark:border-gray-700 fade-in">
        <div class="flex justify-center mb-6">
            <span class="material-symbols-outlined text-6xl text-[#6750a4] dark:text-[#d0bcff]">lock</span>
        </div>
        <h2 class="text-2xl font-bold text-center mb-8 text-gray-900 dark:text-white">Iniciar Sesión</h2>
        
        <form id="login-form" class="space-y-6">
            <div class="relative">
                <input type="email" id="email" required
                    class="block px-4 pb-2.5 pt-6 w-full text-sm text-gray-900 bg-gray-50 dark:bg-gray-700 dark:text-white rounded-t-md border-b-2 border-gray-300 appearance-none focus:outline-none focus:border-[#6750a4] peer"
                    placeholder=" " />
                <label for="email"
                    class="absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-[#6750a4] peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3">Correo Electrónico</label>
            </div>
            
            <div class="relative">
                <input type="password" id="password" required
                    class="block px-4 pb-2.5 pt-6 w-full text-sm text-gray-900 bg-gray-50 dark:bg-gray-700 dark:text-white rounded-t-md border-b-2 border-gray-300 appearance-none focus:outline-none focus:border-[#6750a4] peer"
                    placeholder=" " />
                <label for="password"
                    class="absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-[#6750a4] peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3">Contraseña</label>
            </div>

            <p id="login-error" class="text-red-500 text-sm text-center hidden"></p>

            <button type="submit"
                class="w-full text-white bg-[#6750a4] hover:bg-[#4f378b] focus:ring-4 focus:outline-none focus:ring-[#eaddff] font-medium rounded-full text-sm px-5 py-3 text-center transition-colors">
                Entrar
            </button>
        </form>
    </div>
</div>
